# Parametric payout rules. First matching rule wins. pays is a whole percent fraction of
# sum insured. Rule ids are permanent: never renumber or reuse one.
maize:
  - id: 1
    if: loss_mean >= 0.60
    pays: 1.00
  - id: 2
    if: loss_mean >= 0.35
    pays: 0.50
  - id: 3
    if: loss_mean >= 0.15
    pays: 0.20
rice:
  - id: 4
    if: loss_mean >= 0.60
    pays: 1.00
  - id: 5
    if: loss_mean >= 0.35
    pays: 0.50
  - id: 6
    if: loss_mean >= 0.15
    pays: 0.20
sorghum:
  - id: 7
    if: loss_mean >= 0.60
    pays: 1.00
  - id: 8
    if: loss_mean >= 0.35
    pays: 0.50
  - id: 9
    if: loss_mean >= 0.15
    pays: 0.20
gate:
  min_confidence: 0.80
